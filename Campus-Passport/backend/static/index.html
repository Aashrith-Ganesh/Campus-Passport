.sp-card{background:#fff;border:1px solid #e3e8f2;border-radius:16px;padding:18px;box-shadow:0 4px 18px rgba(20,35,70,.05)}
.sp-span-12{grid-column:span 12}.sp-span-8{grid-column:span 8}.sp-span-7{grid-column:span 7}.sp-span-6{grid-column:span 6}.sp-span-5{grid-column:span 5}.sp-span-4{grid-column:span 4}
.sp-kicker{font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:800;color:#73809a}
.sp-big{font-size:34px;font-weight:900;letter-spacing:-.03em;margin-top:5px}.sp-muted{color:#69758a;font-size:13px}
.sp-row{display:flex;align-items:center;justify-content:space-between;gap:12px}.sp-row+.sp-row{margin-top:10px}
.sp-chip{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:800;background:#eef2ff;color:#244de5}
.sp-chip.green{background:#ecfdf3;color:#16834a}.sp-chip.amber{background:#fff7e6;color:#9a6700}.sp-chip.red{background:#fff0f0;color:#b42318}
.sp-progress{height:8px;background:#edf1f7;border-radius:99px;overflow:hidden;margin-top:12px}.sp-progress>i{display:block;height:100%;background:#244de5;border-radius:99px}
.sp-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.sp-btn{border:0;border-radius:10px;padding:10px 13px;font-weight:800;font-size:13px;cursor:pointer;background:#244de5;color:#fff}.sp-btn.secondary{background:#eef2f8;color:#172033}.sp-btn.green{background:#16834a}.sp-btn.danger{background:#b42318}
.sp-input,.sp-select,.sp-textarea{width:100%;border:1px solid #dbe2ef;border-radius:10px;padding:10px 11px;background:#fff;color:#172033;outline:none;font-size:13px}.sp-input:focus,.sp-select:focus,.sp-textarea:focus{border-color:#244de5;box-shadow:0 0 0 3px rgba(36,77,229,.1)}
.sp-label{font-size:12px;font-weight:800;margin:12px 0 6px;display:block}.sp-textarea{min-height:76px;resize:vertical}
.sp-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sp-form-full{grid-column:1/-1}
.sp-table{width:100%;border-collapse:collapse;font-size:12px}.sp-table th{text-align:left;color:#73809a;font-size:10px;text-transform:uppercase;letter-spacing:.06em;padding:9px;border-bottom:1px solid #e6ebf3}.sp-table td{padding:11px 9px;border-bottom:1px solid #eef1f6;vertical-align:top}.sp-table tr:last-child td{border-bottom:0}
.sp-amount.plus{color:#16834a;font-weight:900}.sp-amount.minus{color:#b42318;font-weight:900}
.sp-empty{padding:22px;text-align:center;color:#7a8497;font-size:13px}
.sp-alert{padding:11px 13px;border-radius:11px;font-size:12px;margin-bottom:12px;display:none}.sp-alert.show{display:block}.sp-alert.ok{background:#ecfdf3;color:#166534}.sp-alert.err{background:#fff1f2;color:#9f1239}
.sp-statline{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.sp-divider{height:1px;background:#edf0f5;margin:16px 0}
@media(max-width:800px){#sp-panel{width:100vw}.sp-span-8,.sp-span-7,.sp-span-6,.sp-span-5,.sp-span-4{grid-column:span 12}.sp-form-grid{grid-template-columns:1fr}#sp-health{margin-left:0}}
</style>

<script id="student-pocket-app">
(function(){
  "use strict";
  const API = localStorage.getItem("campusPassportApiBase") || "http://localhost:8000";
  const state = { role:"STUDENT", studentId:"STU001", balance:null, transactions:[], categories:[], students:[], open:false };

  const $ = (id)=>document.getElementById(id);
  const esc = (v)=>String(v??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  async function api(path, opts={}){
    const headers = {"Content-Type":"application/json", ...(opts.headers||{})};
    const res = await fetch(API+path,{...opts,headers});
    let data=null; try{data=await res.json()}catch{}
    if(!res.ok) throw new Error(data?.detail || `Request failed (${res.status})`);
    return data;
  }
  function setAlert(msg, ok=true){
    const a=$("sp-alert"); a.textContent=msg; a.className="sp-alert show "+(ok?"ok":"err");
    clearTimeout(setAlert.t); setAlert.t=setTimeout(()=>a.className="sp-alert",4200);
  }
  function money(n){return Number(n||0).toLocaleString("en-IN")}
  function fmtDate(v){try{return new Date(v).toLocaleString("en-IN",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})}catch{return v}}
  function roleHeader(role=state.role){return {"X-Actor-Role":role}}

  const shell = `

        </header>
        <div id="sp-toolbar">
          <button class="sp-role active" data-role="STUDENT">Student</button>

        </div>
        <div id="sp-body">
          <div id="sp-alert" class="sp-alert"></div>

          <div id="sp-student" class="sp-view active">

                <div class="sp-kicker">Teacher actions</div><div style="font-size:20px;font-weight:900;margin-top:5px">Deduct points</div>
                <form id="sp-deduct-form">
                  <label class="sp-label">Student</label><select class="sp-select" id="sp-deduct-student"></select>
                  <div class="sp-form-grid">
                    <div><label class="sp-label">Points to deduct</label><input class="sp-input" id="sp-deduct-amount" type="number" min="1" value="10"></div>
                    <div><label class="sp-label">Action event ID</label><input class="sp-input" id="sp-deduct-event" placeholder="INCIDENT-001"></div>
                  </div>
                  <label class="sp-label">Category</label><input class="sp-input" id="sp-deduct-category" value="RESPONSIBILITY_POSITIVE_CONDUCT">
                  <label class="sp-label">Reason</label><textarea class="sp-textarea" id="sp-deduct-reason" placeholder="Document the reason"></textarea>
                  <div class="sp-actions"><button class="sp-btn danger" type="submit">Issue deduction</button></div>
                </form>
              </div>
              <div class="sp-card sp-span-12"><div class="sp-kicker">Backend categories</div><div id="sp-category-info" class="sp-muted" style="margin-top:8px">Loading…</div></div>
            </div>
          </div>

          <div id="sp-merchant" class="sp-view">
            <div class="sp-grid">
              <div class="sp-card sp-span-5">
                <div class="sp-kicker">Merchant terminal</div><div style="font-size:20px;font-weight:900;margin-top:5px">NFC one-tap checkout</div>
                <form id="sp-purchase-form">
                  <label class="sp-label">NFC token</label><input class="sp-input" id="sp-nfc-token" value="tok_aarav_nfc_001">
                  <label class="sp-label">Amount</label><input class="sp-input" id="sp-purchase-amount" type="number" min="1" value="30">
                  <label class="sp-label">Description</label><input class="sp-input" id="sp-purchase-desc" value="Campus Canteen">
                  <div class="sp-actions"><button class="sp-btn green" type="submit">Tap card & charge</button></div>
                </form>
              </div>
              <div class="sp-card sp-span-7">
                <div class="sp-kicker">Tap result</div><div id="sp-tap-result" style="margin-top:12px" class="sp-muted">No transaction yet.</div>
              </div>
            </div>
          </div>

          <div id="sp-admin" class="sp-view">
            <div class="sp-grid">
              <div class="sp-card sp-span-7">
                <div class="sp-kicker">Admin overview</div><div style="font-size:20px;font-weight:900;margin-top:5px">Student wallet inspector</div>
                <label class="sp-label">Student</label><select class="sp-select" id="sp-admin-student"></select>
                <div id="sp-admin-balance" style="margin-top:14px" class="sp-muted">Select a student.</div>
                <div class="sp-actions"><button class="sp-btn" id="sp-admin-refresh">Load balance</button></div>
              </div>
              <div class="sp-card sp-span-5">
                <div class="sp-kicker">NFC card lookup</div><div style="font-size:20px;font-weight:900;margin-top:5px">Card status</div>
                <div class="sp-muted" style="margin-top:8px">Choose a student to inspect their active card mapping.</div>
                <div id="sp-admin-card" style="margin-top:14px"></div>
              </div>
              <div class="sp-card sp-span-12"><div class="sp-kicker">Important</div><div class="sp-muted" style="margin-top:8px">This UI only exposes operations currently present in the supplied FastAPI backend. It does not invent endpoints for features that are not implemented in the ZIP.</div></div>
            </div>
          </div>
        </div>
      </section>
    </div>
  `;

  function inject(){
    document.body.insertAdjacentHTML("beforeend", shell);
    $("sp-launcher").onclick=()=>openPocket();
    $("sp-close").onclick=()=>closePocket();
    $("sp-overlay").addEventListener("click",e=>{if(e.target.id==="sp-overlay")closePocket()});
    document.addEventListener("keydown",e=>{if(e.key==="Escape")closePocket()});
    document.querySelectorAll(".sp-role").forEach(b=>b.onclick=()=>switchRole(b.dataset.role));
    $("sp-refresh").onclick=()=>loadStudent();
    $("sp-reward-form").onsubmit=submitReward;
    $("sp-deduct-form").onsubmit=submitDeduction;
    $("sp-purchase-form").onsubmit=submitPurchase;
    $("sp-admin-refresh").onclick=loadAdmin;
    $("sp-admin-student").onchange=loadAdmin;
    $("sp-use-academic").onclick=()=>setAlert("Academic redemption UI is ready for the backend benefit endpoint; the supplied backend does not currently expose an academic-redemption route.",false);
    checkHealth();
    loadStudents();
    loadCategories();
  }
  function openPocket(){ $("sp-overlay").style.display="block"; $("sp-overlay").setAttribute("aria-hidden","false"); state.open=true; loadStudent(); }
  function closePocket(){ $("sp-overlay").style.display="none"; $("sp-overlay").setAttribute("aria-hidden","true"); state.open=false; }
  function switchRole(role){
    state.role=role;
    document.querySelectorAll(".sp-role").forEach(b=>b.classList.toggle("active",b.dataset.role===role));
    document.querySelectorAll(".sp-view").forEach(v=>v.classList.toggle("active",v.id==="sp-"+role.toLowerCase()));
    if(role==="STUDENT")loadStudent();
    if(role==="TEACHER")loadStudents();
    if(role==="ADMIN")loadAdmin();
  }

  async function checkHealth(){
    const dot=document.querySelector("#sp-health .sp-dot"), txt=document.querySelector("#sp-health span:last-child");
    try{await api("/health");dot.className="sp-dot ok";txt.textContent="Backend connected";}
    catch{dot.className="sp-dot bad";txt.textContent="Backend offline · start FastAPI on :8000";}
  }

  async function loadStudents(){
    try{
      state.students=await api("/api/students");
      ["sp-reward-student","sp-deduct-student","sp-admin-student"].forEach(id=>{
        const el=$(id); if(!el)return;
        el.innerHTML=state.students.map(s=>`<option value="${esc(s.id)}">${esc(s.name)} · ${esc(s.id)}</option>`).join("");
      });
    }catch(e){setAlert(e.message,false)}
  }

  async function loadCategories(){
    try{
      state.categories=await api("/api/teacher/rewards/categories");
      $("sp-reward-category").innerHTML=state.categories.map(c=>`<option value="${esc(c.category)}">${esc(c.title)} · ${esc(c.recommended_min_points)}–${esc(c.recommended_max_points)}</option>`).join("");
      $("sp-category-info").innerHTML=state.categories.map(c=>`<span class="sp-chip" style="margin:3px">${esc(c.title)} · ${esc(c.default_purpose)}</span>`).join("");
      $("sp-reward-category").onchange=()=>{
        const c=state.categories.find(x=>x.category===$("sp-reward-category").value);
        if(c){$("sp-reward-amount").value=c.recommended_min_points; $("sp-reward-reason").placeholder=`Example: ${c.description}`;}
      };
    }catch(e){$("sp-category-info").textContent=e.message}
  }

  async function loadStudent(){
    const id=state.studentId;
    try{
      const [student,balance,txs,cards]=await Promise.all([
        api(`/api/students/${encodeURIComponent(id)}`),
        api(`/api/student/${encodeURIComponent(id)}/balance`),
        api(`/api/student/${encodeURIComponent(id)}/transactions`),
        api(`/api/student/${encodeURIComponent(id)}/cards`)
      ]);
      state.balance=balance; state.transactions=txs;
      $("sp-student-name").textContent=student.name;
      $("sp-student-meta").textContent=`${student.id} · Grade ${student.class_name} · ${student.preferred_language}`;
      $("sp-total").textContent=money(balance.total_balance);
      $("sp-academic").textContent=money(balance.academic_balance);
      $("sp-campus").textContent=money(balance.campus_balance);
      $("sp-limit").textContent=money(balance.effective_negative_limit);
      const lim=Math.abs(balance.effective_negative_limit||1), cur=Math.max(0,Math.min(100,((balance.campus_balance+lim)/lim)*100));
      $("sp-limitbar").style.width=cur+"%";
      const card=cards.find(c=>c.status==="ACTIVE")||cards[0];
      $("sp-card-id").textContent=card?card.card_id:"No card";
      $("sp-card-status").textContent=card?`${card.status} · ${card.card_uid}`:"No NFC card registered";
      $("sp-tx-count").textContent=`${txs.length} entries`;
      $("sp-tx-body").innerHTML=txs.length?txs.map(t=>{
        const positive=t.amount>=0, cls=positive?"plus":"minus";
        return `<tr><td>${fmtDate(t.created_at)}</td><td>${esc(t.transaction_type)}</td><td><span class="sp-chip">${esc(t.purpose)}</span></td><td>${esc(t.reason)}</td><td class="sp-amount ${cls}">${positive?"+":""}${money(t.amount)}</td></tr>`
      }).join(""):`<tr><td colspan="5" class="sp-empty">No ledger transactions.</td></tr>`;
    }catch(e){setAlert(e.message,false)}
  }

  async function submitReward(e){
    e.preventDefault();
    const studentId=$("sp-reward-student").value;
    const payload={
      student_id:studentId,
      category:$("sp-reward-category").value,
      amount:Number($("sp-reward-amount").value),
      reason:$("sp-reward-reason").value.trim(),
      action_event_id:$("sp-reward-event").value.trim()||null,
      actor_role:"TEACHER",
      issued_by:"Teacher"
    };
    if(!payload.reason)return setAlert("Add a reason for the reward.",false);
    try{
      const tx=await api("/api/rewards",{method:"POST",headers:roleHeader("TEACHER"),body:JSON.stringify(payload)});
      setAlert(`Reward created: +${money(tx.amount)} points`);
      state.studentId=studentId;
      await loadStudent();
    }catch(e){setAlert(e.message,false)}
  }

  async function submitDeduction(e){
    e.preventDefault();
    const studentId=$("sp-deduct-student").value;
    const payload={
      student_id:studentId,
      category:$("sp-deduct-category").value.trim()||"RESPONSIBILITY_POSITIVE_CONDUCT",
      amount:Number($("sp-deduct-amount").value),
      reason:$("sp-deduct-reason").value.trim(),
      action_event_id:$("sp-deduct-event").value.trim()||null,
      actor_role:"TEACHER",
      issued_by:"Teacher"
    };
    if(!payload.reason)return setAlert("Add a documented reason for the deduction.",false);
    try{
      const tx=await api("/api/deductions",{method:"POST",headers:roleHeader("TEACHER"),body:JSON.stringify(payload)});
      setAlert(`Deduction created: ${money(tx.amount)} points`);
      state.studentId=studentId;
      await loadStudent();
    }catch(e){setAlert(e.message,false)}
  }

  async function submitPurchase(e){
    e.preventDefault();
    const token=$("sp-nfc-token").value.trim(), amount=Number($("sp-purchase-amount").value);
    if(!token||amount<=0)return setAlert("Enter a valid NFC token and amount.",false);
    const payload={token,merchant_id:"MERCHANT001",amount,description:$("sp-purchase-desc").value.trim()||"Campus Purchase",idempotency_key:"ui_"+Date.now()};
    try{
      const r=await api("/api/nfc/tap",{method:"POST",headers:roleHeader("MERCHANT"),body:JSON.stringify(payload)});
      const p=r.purchase_result;
      $("sp-tap-result").innerHTML=`<div class="sp-chip green">✓ APPROVED</div><div style="font-size:24px;font-weight:900;margin-top:10px">${esc(r.student_name)}</div><div class="sp-muted" style="margin-top:4px">Card ${esc(r.card_id)}</div><div class="sp-divider"></div><div class="sp-row"><span>Used</span><strong>${money(p.purchase_amount)} points</strong></div><div class="sp-row"><span>Campus balance</span><strong>${money(p.new_balance)} points</strong></div><div class="sp-row"><span>Total balance</span><strong>${money(p.total_balance)} points</strong></div>`;
      setAlert("NFC purchase completed.");
      state.studentId=r.student_id; await loadStudent();
    }catch(e){$("sp-tap-result").innerHTML=`<div class="sp-chip red">✕ REJECTED</div><div style="margin-top:10px;font-weight:800">${esc(e.message)}</div>`;setAlert(e.message,false)}
  }

  async function loadAdmin(){
    const id=$("sp-admin-student").value||"STU001";
    try{
      const [student,balance,cards]=await Promise.all([
        api(`/api/students/${encodeURIComponent(id)}`),
        api(`/api/student/${encodeURIComponent(id)}/balance`),
        api(`/api/student/${encodeURIComponent(id)}/cards`)
      ]);
      $("sp-admin-balance").innerHTML=`<div class="sp-statline"><span class="sp-chip">Total ${money(balance.total_balance)}</span><span class="sp-chip green">Academic ${money(balance.academic_balance)}</span><span class="sp-chip amber">Campus ${money(balance.campus_balance)}</span></div><div class="sp-divider"></div><div class="sp-muted">${esc(student.name)} · ${esc(student.id)} · effective negative limit ${money(balance.effective_negative_limit)}</div>`;
      $("sp-admin-card").innerHTML=cards.length?cards.map(c=>`<div class="sp-row"><div><strong>${esc(c.card_id)}</strong><div class="sp-muted">${esc(c.card_uid)}</div></div><span class="sp-chip ${c.status==="ACTIVE"?"green":"red"}">${esc(c.status)}</span></div>`).join(""):`<div class="sp-empty">No cards.</div>`;
    }catch(e){setAlert(e.message,false)}
  }

  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",inject);else inject();
})();
</script>
</body></html>
